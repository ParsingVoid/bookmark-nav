name: Release

# Builds a Windows installer and attaches it to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed. Windows-only for now since that's the
# only platform this app has been built/run on; extend `runs-on` to a matrix
# (macos-latest, ubuntu-latest) if/when it's tested elsewhere.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used to sign updater artifacts (bundle.createUpdaterArtifacts in
          # tauri.conf.json) so the app can verify updates against the pubkey
          # embedded there. Must be the raw key content, not a file path —
          # the *_PATH variant is silently ignored during the build/sign step.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bookmark-nav ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
