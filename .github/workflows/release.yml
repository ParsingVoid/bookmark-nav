name: Release

# Builds a Windows installer and attaches it to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed. Windows-only for now since that's the
# only platform this app has been built/run on; extend `runs-on` to a matrix
# (macos-latest, ubuntu-latest) if/when it's tested elsewhere.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bookmark-nav ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
